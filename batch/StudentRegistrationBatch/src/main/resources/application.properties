
spring.application.name=StudentRegistrationBatch

server.port=8081

# Existing Student Registration database
spring.datasource.url=jdbc:mysql://localhost:3306/student_registration_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Scheduler controls when the job starts
spring.batch.job.enabled=false

# Initialize Spring Batch metadata tables
spring.batch.jdbc.initialize-schema=always
