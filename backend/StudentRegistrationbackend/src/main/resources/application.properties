
spring.application.name=student-registration-system

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/student_registration_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gmail SMTP - Admin account sends emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Admin Account
#1hr expiration
app.admin.email=rajusadhanajaladi@gmail.com
app.admin.password=${ADMIN_PASSWORD:}


# JWT Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000 

# Frontend URL
app.frontend-url=http://localhost:5173

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
